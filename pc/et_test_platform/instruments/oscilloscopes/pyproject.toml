[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oscilloscope-lib"
version = "0.1.0"
description = "Self-contained RIGOL MSO5204 oscilloscope driver library (SCPI instrument control)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "PyVISA>=1.14",
  "pyvisa-py>=0.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

# The package maps this directory itself onto the top-level "oscilloscopes" name,
# so the folder can be renamed or moved without changing any import path.
[tool.setuptools]
packages = [
  "oscilloscopes",
  "oscilloscopes._internal",
  "oscilloscopes.mso5204",
  "oscilloscopes.mso5204.controls",
]

[tool.setuptools.package-dir]
oscilloscopes = "."

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-q"

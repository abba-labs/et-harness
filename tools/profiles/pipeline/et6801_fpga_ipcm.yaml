schema: et-pipeline-profile/v1
name: et6801_fpga_ipcm
target_kind: fpga

# IPCM使用独立Peer清单；公共流水线与已通过的SPINLOCK Peer保持不变。
# 适用：仅 ET6801 FPGA IPCM 双核 Peer（Core1 ET6801_CORE1_ITCM_IPCM_PEER）。
# Peer 部署成功且 Mailbox Ready 后，禁止再对 Core0 执行 execute.start_target / J-Link r。
# 违反：Core1 被连带打死 → Case 前 peer_cancel / PEER_RESULT 超时 → 无 DUT 功能观测。
# 对照：2026-09-03 PASS 与 2026-09-11 跳过 start_target 的 34/34 PASS；
#       同 Peer 后再 start_target 则 34/34 FAIL。不得外推 Silicon 或其他 Peer。
constraints:
  mutually_exclusive:
    - [deploy.firmware, execute.start_target]

steps:
  build.bootrom:
    script: tools/fpga/et6801/build_bootrom.ps1
    hardware_action: false
    arguments:
      - {option: -Keil, from: environment.tools.keil.executable, kind: file}
      - {option: -RtePath, from: environment.tools.keil.pack_root, kind: directory}
      - {option: -Project, from: dut.sources.bootrom_project, kind: file}
      - {option: -Target, value: ROM}

  build.firmware:
    script: tools/firmware/run_et6801_formal_dualcore.ps1
    hardware_action: false
    arguments:
      - {option: -Action, value: Build}
      - {option: -PeerManifest, value: firmware/chips/et6801/core1_peer/deploy/et6801_fpga_ipcm.json, kind: file, base: repository}
      - {option: -Keil, from: environment.tools.keil.executable, kind: file}
      - {option: -RtePath, from: environment.tools.keil.pack_root, kind: directory}

  deploy.bitfile:
    script: tools/fpga/et6801/program_xc7vx980t.ps1
    hardware_action: true
    arguments:
      - {option: -ToolRoot, from: environment.tools.vivado.root, kind: directory}
      - {option: -BitFile, from: dut.images.bitfile.path, kind: file}
      - {flag: -ConfirmProgram}

  deploy.bootrom:
    script: tools/fpga/et6801/load_bootrom_keil_debug.ps1
    hardware_action: true
    arguments:
      - {option: -Keil, from: environment.tools.keil.executable, kind: file}
      - {option: -RtePath, from: environment.tools.keil.pack_root, kind: directory}
      - {option: -Project, from: dut.sources.bootrom_project, kind: file}
      - {option: -Target, value: ROM}
      - {flag: -SkipBuild}
      - {flag: -ConfirmRamLoad}

  deploy.firmware:
    requires: [deploy.bitfile, deploy.bootrom]
    script: tools/firmware/run_et6801_formal_dualcore.ps1
    hardware_action: true
    arguments:
      - {option: -Action, value: Deploy}
      - {option: -PeerManifest, value: firmware/chips/et6801/core1_peer/deploy/et6801_fpga_ipcm.json, kind: file, base: repository}
      - {option: -Keil, from: environment.tools.keil.executable, kind: file}
      - {option: -RtePath, from: environment.tools.keil.pack_root, kind: directory}
      - {option: -JLink, from: environment.tools.jlink.executable, kind: file}
      - {option: -JLinkSerial, from: dut.debug.probe_serial, optional: true}
      - {flag: -ConfirmPFlashProgram}
      - {flag: -ConfirmRunControl}
      - {flag: -ConfirmPeerDeploy}

  execute.start_target:
    script: tools/firmware/flash_and_run_et6801_firmware.ps1
    hardware_action: true
    arguments:
      - {option: -Project, value: firmware/build/et6801/ET6801_Automated_Test.uvprojx, kind: file, base: repository}
      - {option: -Target, value: ET6801_SILICON_FLASH}
      - {option: -Keil, from: environment.tools.keil.executable, kind: file}
      - {option: -RtePath, from: environment.tools.keil.pack_root, kind: directory}
      - {option: -JLink, from: environment.tools.jlink.executable, kind: file}
      - {option: -JLinkSerial, from: dut.debug.probe_serial, optional: true}
      - {flag: -SkipFlash}
      - {flag: -ConfirmRunControl}

standard: gate-v0.1
file_id: G040
title: Logic And Static Code Review
nodes:
  - id: G040.010
    title: Control Flow And State
    children:
      - id: G040.010.010
        title: Control Flow Must Converge To Valid State
        gate:
          level: MUST
          when: 修改条件分支、状态机、operation lifecycle、success/fail/timeout/cancel 流程或 early return 时
          steps:
            - id: control-flow
              tool: code.review
              args:
                focus: branches_state_transitions_terminal_outcome
          pass:
            mode: all_steps_pass
          refs: [R100.200.010, R100.400.010, R300.600.010]
  - id: G040.020
    title: Error And Edge Paths
    children:
      - id: G040.020.010
        title: Error And Edge Paths Must Not Skip Required Logic
        gate:
          level: MUST
          when: 修改错误处理、异常返回、边界条件、重试、timeout、cancel 或 recovery 路径时
          steps:
            - id: edge-paths
              tool: code.review
              args:
                focus: error_edge_early_return_recovery_missing_path
          pass:
            mode: all_steps_pass
          refs: [R300.500.010, R300.600.010, R300.600.020]
  - id: G040.030
    title: Pre Build Static Sanity
    children:
      - id: G040.030.010
        title: Diff Must Pass Static Syntax And API Sanity Review
        gate:
          level: MUST
          when: 任何 C/C++、Python、Qt、配置解析或接口调用代码修改进入编译构建之前
          steps:
            - id: static-sanity
              tool: code.review
              args:
                focus: obvious_syntax_api_type_null_uninitialized_misuse
          pass:
            mode: all_steps_pass
          refs: [A050]

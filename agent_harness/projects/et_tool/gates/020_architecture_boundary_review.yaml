standard: gate-v0.1
file_id: G020
title: Architecture Boundary Review
nodes:
  - id: G020.010
    title: Layer Responsibility
    children:
      - id: G020.010.010
        title: Change Must Stay In Correct Architecture Layer
        gate:
          level: MUST
          when: 修改 GUI、CLI、Application、Workflow、Backend、Protocol、Transport、Probe、Platform 或组合边界代码时
          steps:
            - id: layer-boundary
              tool: architecture.review
              args:
                focus: responsibility_dependency_direction
          pass:
            mode: all_steps_pass
          refs: [A020, A030, A050, R300, R400, R500]
  - id: G020.020
    title: Chip And Route Independence
    children:
      - id: G020.020.010
        title: Chip Local Code Must Preserve Independence
        gate:
          level: MUST
          when: 修改 source/apps、application、workflow、backend、protocol 等 chip-local 区域或新增芯片 GUI/CLI 实现时
          steps:
            - id: chip-independence
              tool: architecture.review
              args:
                focus: cross_chip_cross_route_dependency
          pass:
            mode: all_steps_pass
          refs: [A010, A050, R600]
  - id: G020.030
    title: Formal Product Path
    children:
      - id: G020.030.010
        title: Product Change Must Not Bypass Formal Execution Path
        gate:
          level: MUST
          when: 修改 GUI 硬件动作、CLI dispatch、Workflow、Backend 或硬件执行入口时
          steps:
            - id: product-path
              tool: architecture.review
              args:
                focus: gui_cli_workflow_backend_formal_path
          pass:
            mode: all_steps_pass
          refs: [A020, A030, A050, R100, R200, R500]

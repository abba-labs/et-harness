standard: gate-v0.1
file_id: G030
title: Rule Compliance Review
nodes:
  - id: G030.010
    title: Applicable Rule Selection
    children:
      - id: G030.010.010
        title: Applicable Rules Must Be Identified From Change Scope
        gate:
          level: MUST
          when: 任何 ET-TOOL 代码修改进入代码审查阶段时
          steps:
            - id: applicable-rules
              tool: rule.review
              args:
                focus: select_rules_by_changed_chip_route_feature_layer
          pass:
            mode: all_steps_pass
          refs: [R100, R200, R300, R400, R500, R600, R700, R800, R900]
  - id: G030.020
    title: Mandatory Constraint Compliance
    children:
      - id: G030.020.010
        title: Diff Must Not Violate Applicable MUST Or MUST_NOT Rules
        gate:
          level: MUST
          when: 已经确定当前 Change 的适用 Rule 集合后
          steps:
            - id: rule-compliance
              tool: rule.review
              args:
                focus: must_must_not_diff_compliance
          pass:
            mode: all_steps_pass
          refs: [R100, R200, R300, R400, R500, R600, R700, R800, R900]

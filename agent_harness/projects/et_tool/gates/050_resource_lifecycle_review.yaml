standard: gate-v0.1
file_id: G050
title: Resource And Lifecycle Review
nodes:
  - id: G050.010
    title: Resource Ownership
    children:
      - id: G050.010.010
        title: Every Runtime Resource Must Have Clear Ownership And Release
        gate:
          level: MUST
          when: 新增或修改 QProcess、QTimer、QThread、Session、UART/CAN/J-Link/CMSIS-DAP handle、临时文件或其他运行时资源时
          steps:
            - id: ownership
              tool: lifecycle.review
              args:
                focus: creator_owner_release_raii_parenting
          pass:
            mode: all_steps_pass
          refs: [K001.013, K001.015, R300.600.020]
  - id: G050.020
    title: Exit Path Cleanup
    children:
      - id: G050.020.010
        title: All Exit Paths Must Reach Required Cleanup
        gate:
          level: MUST
          when: 修改 success、fail、timeout、cancel、disconnect、返回首页、切换芯片、关闭窗口或退出软件路径时
          steps:
            - id: cleanup-paths
              tool: lifecycle.review
              args:
                focus: all_terminal_and_exit_paths_cleanup
            - id: target-recovery
              tool: lifecycle.review
              args:
                focus: host_cleanup_vs_target_state_recovery
          pass:
            mode: all_steps_pass
          refs: [K001.014, R300.600.020, R100.300.010]
  - id: G050.030
    title: Async And Progress Lifecycle
    children:
      - id: G050.030.010
        title: Async Process And Progress Lifecycle Must Be Closed
        gate:
          level: MUST
          when: 修改长操作、异步进程、progress sidecar、progress callback、poll timer 或 GUI busy state 时
          steps:
            - id: async-lifecycle
              tool: lifecycle.review
              args:
                focus: process_timer_thread_progress_terminal_cleanup
          pass:
            mode: all_steps_pass
          refs: [K001.016, K001.017, K001.020, R100.400.020, R200.400.020]

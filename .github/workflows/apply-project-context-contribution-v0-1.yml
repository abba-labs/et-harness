name: Apply Project Context Contribution v0.1

on:
  push:
    branches:
      - feat/harness-project-context-contribution-v0.1
    paths:
      - 'agent_harness/patch_requests/apply_project_context_contribution_v0_1.py'
      - '.github/workflows/apply-project-context-contribution-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/harness-project-context-contribution-v0.1
          fetch-depth: 0
      - name: Apply deterministic public patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agent_harness/patch_requests/apply_project_context_contribution_v0_1.py')
          text = path.read_text(encoding='utf-8')
          old = '''    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{relative}: expected one replacement, found {count}")
    path.write_text(text.replace(old, new, 1), encoding="utf-8")
'''
          new = '''    count = text.count(old)
    repeated_contract_route = (
        relative.endswith("auto_governance_engine/src/contracts.ts")
        and old.startswith("  readonly route: AutoGovernanceRouteSnapshot")
        and count in {1, 2}
    )
    if count != 1 and not repeated_contract_route:
        raise SystemExit(f"{relative}: expected one replacement, found {count}")
    path.write_text(text.replace(old, new, 1), encoding="utf-8")
'''
          if text.count(old) != 1:
              raise SystemExit('patch helper marker mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python agent_harness/patch_requests/apply_project_context_contribution_v0_1.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'Abba-shenfu'
          git config user.email '76858597+Abba-shenfu@users.noreply.github.com'
          git add \
            agent_harness/governance_core/src/contracts.ts \
            agent_harness/public_plugins/context_builder/src/contracts.ts \
            agent_harness/public_plugins/context_builder/src/context-lint.ts \
            agent_harness/public_plugins/context_builder/src/context-management-service.ts \
            agent_harness/public_plugins/auto_governance_engine/src/contracts.ts \
            agent_harness/public_plugins/auto_governance_engine/src/index.ts \
            agent_harness/public_plugins/auto_governance_engine/src/service.ts
          git commit -m 'feat: add optional project context contributions'
          git push origin HEAD:feat/harness-project-context-contribution-v0.1

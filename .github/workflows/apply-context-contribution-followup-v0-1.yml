name: Apply Context Contribution Follow-up v0.1

on:
  push:
    branches:
      - feat/harness-project-context-contribution-v0.1
    paths:
      - 'agent_harness/patch_requests/apply_context_contribution_followup_v0_1.py'
      - '.github/workflows/apply-context-contribution-followup-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/harness-project-context-contribution-v0.1
          fetch-depth: 0
      - name: Apply compatibility and isolation fixes
        run: python agent_harness/patch_requests/apply_context_contribution_followup_v0_1.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'Abba-shenfu'
          git config user.email '76858597+Abba-shenfu@users.noreply.github.com'
          git add \
            agent_harness/public_plugins/context_builder/src/context-management-service.ts \
            agent_harness/public_plugins/auto_governance_engine/src/context-contribution.ts \
            agent_harness/public_plugins/auto_governance_engine/src/service.ts \
            agent_harness/public_plugins/auto_governance_engine/tests/context-contribution.test.ts
          git commit -m 'fix: preserve generic context compatibility and isolation'
          git push origin HEAD:feat/harness-project-context-contribution-v0.1

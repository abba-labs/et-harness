name: Import ET Harness Migration Snapshot

on:
  push:
    branches:
      - migration/raw-from-et-tool-main-20260827

permissions:
  contents: write

env:
  SNAPSHOT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-0254-8206-959c-2963243e9654/raw?se=2026-08-27T06%3A30%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=47229141-45ce-58d4-82b6-fc5e01e98cb0&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T05%3A49%3A54Z&ske=2026-08-28T05%3A49%3A54Z&sks=b&skv=2026-02-06&sig=ePETEpIoqjQ7X5mjLgqNCaTPngqqYcyob0ntASzHYyo%3D"
  OUTER_SHA256: "1e47d5d6ab7a8388a51ed3aec62caa112523815a8f641855d0bc5fad4fde4986"
  INNER_SHA256: "aa99acc35df6b1abf6fa8382bc7db315e126757dc4ecbc2ac944d17cf4a91a9b"

jobs:
  import-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SNAPSHOT_URL" -o "$RUNNER_TEMP/et-harness-raw-snapshot.zip"
          echo "$OUTER_SHA256  $RUNNER_TEMP/et-harness-raw-snapshot.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/et-harness-artifact"
          unzip -q "$RUNNER_TEMP/et-harness-raw-snapshot.zip" -d "$RUNNER_TEMP/et-harness-artifact"
          echo "$INNER_SHA256  $RUNNER_TEMP/et-harness-artifact/et-harness-raw-snapshot.tar.gz" | sha256sum --check --strict

      - name: Import raw Harness snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/et-harness-artifact/et-harness-raw-snapshot.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/import-et-harness-migration-snapshot.yml"
          git config user.name "ET Harness Migration"
          git config user.email "et-harness-migration@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "chore: import raw Harness snapshot from et-tool"
          git push origin HEAD:migration/raw-from-et-tool-main-20260827

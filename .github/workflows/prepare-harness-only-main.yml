name: Prepare Harness-Only Main Candidate

on:
  push:
    branches:
      - migration/harness-only-main-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  separate-project-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove project-specific runtime content
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            agent_harness/projects/et_tool \
            agent_harness/pilots/external_chat_agent \
            agent_harness/pilots/real_provider

          rm -f agent_harness/dev/apply_knowledge_governance_decision_v0_1.py
          rm -f agent_harness/validation/phase3_architecture_navigator_integration.sh
          rm -f agent_harness/validation/phase4_ettool_*_integration.sh
          rm -f agent_harness/validation/phase4a_external_chat_agent_*.sh
          rm -f agent_harness/validation/phase4a_real_provider_governance_pilot_v0_1.sh
          rm -f agent_harness/validation/phase4b_adversarial_governance_negative_v0_1.sh
          rm -f agent_harness/validation/phase4c_knowledge_adversarial_v0_1.sh
          rm -f agent_harness/validation/phase4d_real_task_matrix_v0_1.sh

          mkdir -p agent_harness/projects
          cat > agent_harness/projects/README.md <<'EOF'
          # Project Plugins

          `et-harness/main` 不保存任何真实项目的私有 Project Plugin、项目源码或项目知识库。

          真实项目只存在于长期项目分支：

          ```text
          project/<project-name>
          ```

          每个项目分支由以下内容组成：

          ```text
          当前 main 公共 Harness
          + 项目完整代码
          + 项目 Project Plugin
          + 项目 Knowledge / Rules / Architecture / Gates
          ```

          `main` 只允许保留不依赖真实项目代码的 synthetic/example fixture。
          EOF

          cat > MIGRATION_BOUNDARY.md <<'EOF'
          # ET Harness Repository Boundary

          ## Main

          `main` 是公共 Harness 唯一上游，只保存公共 Contract、公共插件、公共 Runtime、模型适配、共享知识、通用示例和不依赖真实项目的验证。

          ## Project branches

          `project/<name>` 保存公共 Harness 与一个真实项目的完整组合。项目分支定期合并 `main`，禁止将项目分支整体反向合入 `main`。

          ## Initial separation

          初始实现来自 `abba-labs/et-tool`。ET-TOOL Project Plugin、项目型 Pilot 和依赖真实 ET-TOOL 的验证已保留在 `project/et-tool`，未进入 Harness-only main 候选。
          EOF

          git config user.name "ET Harness Migration"
          git config user.email "et-harness-migration@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Harness-only separation is already applied."
            exit 0
          fi

          git commit -m "refactor: separate public Harness from ET-TOOL project content"
          git push origin HEAD:migration/harness-only-main-v0.1

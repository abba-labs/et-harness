name: Apply Generic Route Resolver v2

on:
  push:
    branches:
      - fix/harness-cross-resource-route-expansion-v0.1
    paths:
      - 'agent_harness/patch_requests/apply_generic_route_resolver_v2.py'
      - '.github/workflows/apply-generic-route-resolver-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-generic-route-resolver-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/harness-cross-resource-route-expansion-v0.1
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python agent_harness/patch_requests/apply_generic_route_resolver_v2.py
      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- agent_harness/public_plugins/auto_governance_engine/src/route-resolver.ts || true
          grep -q "resolveGovernanceRouteGraph" agent_harness/public_plugins/auto_governance_engine/src/service.ts
          ! grep -q "candidateRelatedResourceIds" agent_harness/public_plugins/auto_governance_engine/src/service.ts
      - name: Commit patched implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_harness/public_plugins/auto_governance_engine/src/service.ts
          git commit -m "refactor: use bounded governance route graph resolver"
          git push origin HEAD:fix/harness-cross-resource-route-expansion-v0.1

name: ATP Harness Basic Integration

on:
  push:
    branches:
      - test/automated-testing-platform-harness-integration-v0.1
    paths:
      - 'agent_harness/projects/automated_testing_platform/**'
      - '.github/workflows/atp-harness-basic-tests.yml'
  pull_request:
    branches:
      - project/automated-testing-platform
    paths:
      - 'agent_harness/projects/automated_testing_platform/**'
      - '.github/workflows/atp-harness-basic-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atp-harness-basic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-and-public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify test-branch and public Harness boundary
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "test/automated-testing-platform-harness-integration-v0.1" || \
            test "$GITHUB_EVENT_NAME" = "pull_request"
          test -d pc
          test -d firmware
          test -d tools
          test -d project-governance
          test -d agent_harness/governance_core
          test -d agent_harness/public_plugins
          test -f agent_harness/projects/automated_testing_platform/project.yaml
          test -f MIGRATION_SOURCE.json

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            public_base="$PR_BASE_SHA"
          else
            public_base="$(git merge-base HEAD origin/project/automated-testing-platform)"
          fi
          test -n "$public_base"
          echo "Checking project-only boundary from $public_base to $GITHUB_SHA"

          git diff --quiet "$public_base" HEAD -- \
            agent_harness/governance_core \
            agent_harness/project_contract \
            agent_harness/public_plugins \
            agent_harness/model_adapters \
            agent_harness/global_knowledge \
            MIGRATION_SOURCE.json

          git diff --check

  plugin-contract-and-routing:
    needs: branch-and-public-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build public dependencies and run ATP Project Plugin tests
        shell: bash
        env:
          HARNESS_VALIDATION_MODE: clean
          NPM_REGISTRY: https://registry.npmjs.org
          NPM_INSTALL_TIMEOUT_SECONDS: '900'
        run: |
          set -euo pipefail
          source agent_harness/validation/lib/common_runtime.sh
          python -m pip install --disable-pip-version-check PyYAML

          packages=(
            agent_harness/governance_core
            agent_harness/project_contract
            agent_harness/public_plugins/project_manager
            agent_harness/public_plugins/architecture_navigator
            agent_harness/public_plugins/rule_manager
            agent_harness/public_plugins/knowledge_manager
            agent_harness/public_plugins/evidence_state_manager
            agent_harness/public_plugins/gate_manager
            agent_harness/public_plugins/context_builder
            agent_harness/public_plugins/auto_governance_engine
          )

          for package_dir in "${packages[@]}"; do
            echo "==> $package_dir"
            npm_install_if_needed "$package_dir" "$NPM_REGISTRY" "$NPM_INSTALL_TIMEOUT_SECONDS"
            (
              cd "$package_dir"
              npm test
              npm run build
            )
          done

          plugin_dir="agent_harness/projects/automated_testing_platform"
          echo "==> $plugin_dir"
          npm_install_if_needed "$plugin_dir" "$NPM_REGISTRY" "$NPM_INSTALL_TIMEOUT_SECONDS"
          (
            cd "$plugin_dir"
            npm test
            npm run build
          )

          compiler_root="$RUNNER_TEMP/atp-context-compiler-worktree"
          git worktree add --detach "$compiler_root" HEAD
          trap 'git worktree remove --force "$compiler_root" >/dev/null 2>&1 || true' EXIT
          (
            cd "$plugin_dir"
            AUTOMATED_TESTING_PLATFORM_PROJECT_ROOT="$compiler_root" \
              ATP_CONTEXT_CONTRIBUTOR_INTEGRATION=1 \
              npx vitest run tests/context-contributor-compiler.integration.test.ts
          )
          git worktree remove --force "$compiler_root"
          trap - EXIT

          if ! git diff --quiet -- "$plugin_dir"; then
            echo "ATP Project Plugin tests changed tracked plugin resources:"
            git diff -- "$plugin_dir"
            exit 1
          fi

      - name: Remove expected build products and require a clean worktree
        shell: bash
        run: |
          set -euo pipefail
          package_dirs=(
            agent_harness/governance_core
            agent_harness/project_contract
            agent_harness/public_plugins/project_manager
            agent_harness/public_plugins/architecture_navigator
            agent_harness/public_plugins/rule_manager
            agent_harness/public_plugins/knowledge_manager
            agent_harness/public_plugins/evidence_state_manager
            agent_harness/public_plugins/gate_manager
            agent_harness/public_plugins/context_builder
            agent_harness/public_plugins/auto_governance_engine
            agent_harness/projects/automated_testing_platform
          )

          for package_dir in "${package_dirs[@]}"; do
            git clean -fdx -- "$package_dir/dist" "$package_dir/package-lock.json"
            while IFS= read -r -d '' tracked_path; do
              git restore --source=HEAD --worktree -- "$tracked_path"
            done < <(git ls-files -z -- "$package_dir/dist" "$package_dir/package-lock.json")
          done

          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "ATP Project Plugin validation left unexpected worktree changes:"
            echo "$status"
            git diff
            exit 1
          fi

  atp-software-regression:
    needs: branch-and-public-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASELINE_SHA: e9e3affb537113b43d15fbe71b222b213f4410d9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Compare ATP software validation with the frozen project baseline
        shell: bash
        env:
          LOG_ROOT: ${{ runner.temp }}/atp-validation-logs
        run: |
          set -euo pipefail
          mkdir -p "$LOG_ROOT"
          baseline_root="$RUNNER_TEMP/atp-baseline"
          git worktree add --detach "$baseline_root" "$BASELINE_SHA"

          python -m pip install --upgrade pip
          python -m pip install -e "${baseline_root}[test]"

          set +e
          (
            cd "$baseline_root"
            python tools/validate_pc.py
          ) 2>&1 | tee "$LOG_ROOT/baseline.log"
          baseline_rc=${PIPESTATUS[0]}
          set -e

          python -m pip install -e ".[test]"

          set +e
          python tools/validate_pc.py 2>&1 | tee "$LOG_ROOT/head.log"
          head_rc=${PIPESTATUS[0]}
          set -e

          BASELINE_RC="$baseline_rc" HEAD_RC="$head_rc" python - <<'PY'
          import os
          import re
          from pathlib import Path

          log_root = Path(os.environ["LOG_ROOT"])
          pattern = re.compile(r"^FAILED\s+(\S+)", re.MULTILINE)
          baseline_log = (log_root / "baseline.log").read_text(
              encoding="utf-8", errors="replace"
          )
          head_log = (log_root / "head.log").read_text(
              encoding="utf-8", errors="replace"
          )
          baseline_failures = sorted(set(pattern.findall(baseline_log)))
          head_failures = sorted(set(pattern.findall(head_log)))
          baseline_rc = int(os.environ["BASELINE_RC"])
          head_rc = int(os.environ["HEAD_RC"])

          print(f"baseline_rc={baseline_rc}")
          print(f"head_rc={head_rc}")
          print(f"baseline_failures={baseline_failures}")
          print(f"head_failures={head_failures}")

          if baseline_rc == 0:
              if head_rc != 0 or head_failures:
                  raise SystemExit("ATP validation regressed from a passing baseline")
              print("ATP software validation: PASS")
              raise SystemExit(0)

          if not baseline_failures:
              raise SystemExit(
                  "ATP baseline failed without parseable pytest node IDs; cannot prove no regression"
              )

          if head_rc != baseline_rc or head_failures != baseline_failures:
              raise SystemExit("ATP test branch changed the frozen baseline failure set")

          print(
              "ATP software validation: BASELINE_FAIL_UNCHANGED "
              f"({len(head_failures)} pre-existing failures, no new failures)"
          )
          PY

          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "ATP head validation mutated the worktree:"
            echo "$status"
            exit 1
          fi

      - name: Upload ATP baseline comparison logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atp-software-baseline-comparison
          path: ${{ runner.temp }}/atp-validation-logs/*.log
          if-no-files-found: error
          retention-days: 14
